<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#f97316" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <title>Fresh Tweets</title>
        <style>
            * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }
            html,
            body {
                margin: 0;
                padding: 0;
            }
            body {
                background: #f2f2f2;
                color: #000;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, "Noto Sans",
                    "Noto Sans Devanagari", sans-serif;
                min-height: 100dvh;
            }
            #app {
                max-width: 520px;
                margin: 0 auto;
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 800;
                font-size: 16px;
                color: #555;
                padding: 4px 2px 0;
            }
            .brand .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #000;
                display: inline-block;
            }

            /* Base button */
            .btn {
                border: 2px solid #000;
                border-radius: 12px;
                font-family: inherit;
                font-weight: 800;
                cursor: pointer;
                touch-action: manipulation;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                user-select: none;
                -webkit-user-select: none;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
                background: #fff;
                color: #000;
            }
            .btn:active {
                background: #000;
                color: #fff;
            }
            .btn svg {
                flex: 0 0 auto;
            }

            /* Top bar: refresh button + language dropdown */
            .topbar {
                display: flex;
                gap: 8px;
            }
            .topbar .new {
                flex: 1;
            }

            /* NEW: small, light grey, least important */
            .new {
                background: #e2e2e2;
                height: 44px;
                font-size: 15px;
                letter-spacing: 0.5px;
            }
            #newIcon {
                transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.3, 1);
            }

            /* List of tweet cards */
            #list {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            /* Text card */
            .card {
                background: #fff;
                border: 2px solid #000;
                border-radius: 14px;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .actions {
                display: flex;
                gap: 8px;
            }
            .tweet {
                font-weight: 600;
                font-size: 14px;
                line-height: 1.4;
                text-align: left;
                overflow-wrap: anywhere;
                white-space: pre-wrap;
                user-select: text;
                -webkit-user-select: text;
            }

            /* COPY: biggest, solid black, main action */
            .copy {
                background: #000;
                color: #fff;
                flex: 1;
                height: 38px;
                font-size: 14px;
                letter-spacing: 0.5px;
            }
            .copy:active {
                background: #000; /* does not change or move when pressed */
                color: #fff;
            }
            .copy.copied {
                background: #fff;
                color: #000;
            }

            /* POST: medium, outlined */
            .post {
                background: #fff;
                color: #000;
                flex: 1;
                height: 38px;
                font-size: 14px;
            }

            /* Kept as no-ops so JS toggling these classes still works */
            .wiggle,
            .pulse {
                animation: none;
            }

            /* Full-screen "done" message */
            #flash {
                position: fixed;
                inset: 0;
                background: #000;
                color: #fff;
                display: grid;
                place-items: center;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s ease;
                z-index: 50;
            }
            #flash.on {
                opacity: 1;
            }

            /* Small message at the bottom */
            #hint {
                position: fixed;
                left: 50%;
                bottom: 30px;
                transform: translate(-50%, 16px);
                background: #000;
                color: #fff;
                padding: 14px 22px;
                border-radius: 14px;
                font-weight: 700;
                font-size: 17px;
                opacity: 0;
                pointer-events: none;
                transition: all 0.25s ease;
                z-index: 60;
                max-width: 88%;
                text-align: center;
                white-space: pre-line;
            }
            #hint.on {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            /* Error screen */
            #err {
                position: fixed;
                inset: 0;
                background: #f2f2f2;
                display: grid;
                place-items: center;
                z-index: 100;
                text-align: center;
                padding: 24px;
            }
            .erricon {
                font-size: 56px;
            }
            #err p {
                font-weight: 700;
                font-size: 20px;
                color: #000;
                line-height: 1.5;
            }
            .retry {
                background: #000;
                color: #fff;
                height: 64px;
                padding: 0 36px;
                font-size: 20px;
                margin-top: 8px;
            }
            .retry:active {
                background: #fff;
                color: #000;
            }

            @media (min-width: 700px) {
                #app {
                    max-width: 560px;
                    padding-top: 28px;
                }
            }
        </style>
        <meta name="google-adsense-account" content="ca-pub-7579645804240559">
    </head>
    <body>
        <div id="app">
            <div class="topbar">
                <button id="btnNew" class="btn new" aria-label="Refresh">
                    <svg
                        id="newIcon"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                    <span>REFRESH</span>
                </button>
            </div>

            <main id="list" aria-live="polite">
                <div class="tweet">Loading&#8230;</div>
            </main>
        </div>

        <div id="flash">
            <svg
                width="120"
                height="120"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#fff"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <div id="hint"></div>

        <div id="err" style="display: none">
            <div>
                <div class="erricon">&#9888;&#65039;</div>
                <p>Could not load tweets.<br />Check internet and try again.</p>
                <button class="btn retry" onclick="location.reload()">
                    TRY AGAIN
                </button>
            </div>
        </div>

        <script>
            (function () {
                "use strict";
                var $ = function (id) {
                    return document.getElementById(id);
                };
                var LS_CACHE = "td_cache_v1",
                    LS_SEEN = "td_seen_v1";

                /* Safe storage: falls back to memory if localStorage is blocked */
                var store = {
                    m: {},
                    get: function (k) {
                        try {
                            return localStorage.getItem(k);
                        } catch (e) {
                            return Object.prototype.hasOwnProperty.call(
                                this.m,
                                k,
                            )
                                ? this.m[k]
                                : null;
                        }
                    },
                    set: function (k, v) {
                        try {
                            localStorage.setItem(k, v);
                        } catch (e) {
                            this.m[k] = v;
                        }
                    },
                    del: function (k) {
                        try {
                            localStorage.removeItem(k);
                        } catch (e) {
                            delete this.m[k];
                        }
                    },
                };

                var tweets = [];
                var lang = "en";

                /* Accepts: ["tweet",...] | [{"text"|"content"|"tweet"|"body":...},...] | {"tweets":[...]} */
                function normalize(data) {
                    var arr = Array.isArray(data)
                        ? data
                        : data && Array.isArray(data.tweets)
                          ? data.tweets
                          : [];
                    var out = [];
                    for (var i = 0; i < arr.length; i++) {
                        var x = arr[i],
                            s = "";
                        if (typeof x === "string") s = x;
                        else if (x && typeof x === "object")
                            s = x.text || x.content || x.tweet || x.body || "";
                        s = String(s).replace(/\r\n/g, "\n").trim();
                        if (s) out.push(s);
                    }
                    return out;
                }

                function loadTweets() {
                    var cacheKey = LS_CACHE + "_" + lang;
                    return fetch("../tweets/tweets_" + lang + ".json", {
                        cache: "no-cache",
                    })
                        .then(function (r) {
                            if (!r.ok) throw new Error("http " + r.status);
                            return r.json();
                        })
                        .then(function (data) {
                            var arr = normalize(data);
                            if (!arr.length) throw new Error("empty");
                            tweets = arr;
                            store.set(cacheKey, JSON.stringify(arr));
                            return true;
                        })
                        .catch(function () {
                            try {
                                var c = store.get(cacheKey);
                                if (c) {
                                    var arr = normalize(JSON.parse(c));
                                    if (arr.length) {
                                        tweets = arr;
                                        return true;
                                    }
                                }
                            } catch (e) {}
                            return false;
                        });
                }

                /* Shuffle: every visit/refresh shows all tweets in a fresh random order. */
                function shuffleAll() {
                    if (!tweets.length) return;
                    var a = tweets.slice();
                    for (var i = a.length - 1; i > 0; i--) {
                        var j = Math.floor(Math.random() * (i + 1));
                        var tmp = a[i];
                        a[i] = a[j];
                        a[j] = tmp;
                    }
                    render(a);
                }

                function makeCard(text) {
                    var card = document.createElement("div");
                    card.className = "card";

                    var el = document.createElement("div");
                    el.className = "tweet";
                    el.textContent = text;
                    card.appendChild(el);

                    var actions = document.createElement("div");
                    actions.className = "actions";
                    card.appendChild(actions);

                    var c = document.createElement("button");
                    c.className = "btn copy";
                    c.setAttribute("aria-label", "Copy tweet text");
                    c.innerHTML =
                        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
                        '<rect x="9" y="9" width="13" height="13" rx="2.5" ry="2.5"></rect>' +
                        '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>' +
                        "</svg><span>COPY</span>";
                    c.addEventListener("click", function () {
                        copyTweet(text, c);
                    });
                    actions.appendChild(c);

                    var p = document.createElement("button");
                    p.className = "btn post";
                    p.setAttribute("aria-label", "Open X to post this tweet");
                    p.innerHTML =
                        '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
                        '<path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>' +
                        "</svg><span>POST ON X</span>";
                    p.addEventListener("click", function () {
                        postX(text);
                    });
                    actions.appendChild(p);

                    return card;
                }

                function render(arr) {
                    var list = $("list");
                    list.textContent = "";
                    var frag = document.createDocumentFragment();
                    for (var i = 0; i < arr.length; i++)
                        frag.appendChild(makeCard(arr[i]));
                    list.appendChild(frag);
                }

                /* ---------- COPY ---------- */
                function resetCopyUI(b) {
                    if (b._t) {
                        clearTimeout(b._t);
                        b._t = null;
                    }
                    b.classList.remove("copied");
                    b.querySelector("span").textContent = "COPY";
                }
                function copiedUI(b) {
                    b.classList.remove("wiggle");
                    b.classList.add("copied");
                    b.querySelector("span").textContent = "COPIED";
                    var f = $("flash");
                    f.classList.add("on");
                    setTimeout(function () {
                        f.classList.remove("on");
                    }, 650);
                    try {
                        if (navigator.vibrate) navigator.vibrate(60);
                    } catch (e) {}
                    beep();
                    var p = b.parentNode.querySelector(".post");
                    p.classList.remove("pulse");
                    void p.offsetWidth;
                    p.classList.add("pulse");
                    store.set(LS_SEEN, "1");
                    if (b._t) clearTimeout(b._t);
                    b._t = setTimeout(function () {
                        resetCopyUI(b);
                    }, 1900);
                }
                function fallbackCopy(t) {
                    try {
                        var ta = document.createElement("textarea");
                        ta.value = t;
                        ta.setAttribute("readonly", "");
                        ta.style.cssText =
                            "position:fixed;top:0;left:0;font-size:16px;opacity:0;z-index:-1";
                        document.body.appendChild(ta);
                        if (/ipad|iphone|ipod/i.test(navigator.userAgent)) {
                            var r = document.createRange();
                            r.selectNodeContents(ta);
                            var s = window.getSelection();
                            s.removeAllRanges();
                            s.addRange(r);
                        } else {
                            ta.select();
                        }
                        var ok = document.execCommand("copy");
                        document.body.removeChild(ta);
                        return !!ok;
                    } catch (e) {
                        return false;
                    }
                }
                function copyTweet(t, b) {
                    if (!t) return;
                    var useApi = false;
                    try {
                        useApi = !!(
                            navigator.clipboard && window.isSecureContext
                        );
                    } catch (e) {}
                    if (useApi) {
                        navigator.clipboard.writeText(t).then(
                            function () {
                                copiedUI(b);
                            },
                            function () {
                                if (!fallbackCopy(t))
                                    hint(
                                        "Could not auto-copy.\nPress & hold the text, then Copy.",
                                    );
                            },
                        );
                        return;
                    }
                    if (fallbackCopy(t)) copiedUI(b);
                    else
                        hint(
                            "Could not auto-copy.\nPress & hold the text, then Copy.",
                        );
                }

                /* ---------- misc UI ---------- */
                var hintTimer = null;
                function hint(msg) {
                    var h = $("hint");
                    h.textContent = msg;
                    h.classList.add("on");
                    if (hin
