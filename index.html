<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#f97316" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <title>Fresh Tweets</title>
        <style>
            * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }
            html,
            body {
                margin: 0;
                padding: 0;
            }
            body {
                background: #f2f2f2;
                color: #000;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, "Noto Sans",
                    "Noto Sans Devanagari", sans-serif;
                min-height: 100dvh;
            }
            #app {
                max-width: 520px;
                margin: 0 auto;
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 14px;
                padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
            }
            .btn {
                border: 2px solid #000;
                border-radius: 14px;
                font-family: inherit;
                font-weight: 800;
                font-size: 22px;
                height: 84px;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #fff;
                color: #000;
                touch-action: manipulation;
                user-select: none;
                -webkit-user-select: none;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
            }
            .btn.primary {
                background: #000;
                color: #fff;
            }
            .btn:active {
                background: #000;
                color: #fff;
            }
            .btn.primary:active {
                background: #fff;
                color: #000;
            }
        </style>
        <meta name="google-adsense-account" content="ca-pub-7579645804240559" />
    </head>
    <body>
        <div id="app">
            <a class="btn primary" href="/kannada/">ಕನ್ನಡ &middot; Kannada</a>
            <a class="btn" href="/english/">English</a>
        </div>
    </body>
</html>
